; Safehouse community site + Filament/Livewire batch photo uploads.
; CMS allows up to 25 MB per file (config/page_carousel.php).
; Apply with: sudo bash deploy/apply-php-upload-limits-once.sh

upload_max_filesize = 32M
post_max_size = 64M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
