name: CI

# PHPUnit + Pint on PHP 8.4; deploy only after tests pass (main).
# Same VPS as CRM — single PHP 8.4 runtime (see nonprofit-espocrm deploy/upgrade-php84.sh).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-community-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, intl, bcmath, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: PHPUnit
        run: |
          # Ephemeral test key — never commit APP_KEY to the repository.
          export APP_KEY="base64:$(openssl rand -base64 32)"
          php artisan test

      - name: Composer audit
        run: composer audit

  deploy:
    needs: [test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo_mysql
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Preflight deploy path
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -d '${DEPLOY_PATH}' && test -w '${DEPLOY_PATH}'" \
          || {
            echo "::error::Deploy path is missing or not writable: ${DEPLOY_PATH}"
            echo "Run on the server (as root):"
            echo "  sudo mkdir -p ${DEPLOY_PATH}"
            echo "  sudo chown -R ${DEPLOY_USER}:${DEPLOY_USER} ${DEPLOY_PATH}"
            echo "See deploy/DEPLOY.md for the full one-time setup."
            exit 1
          }

      - name: Rsync to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          rsync -rlptz --human-readable \
            -e "ssh -p ${DEPLOY_SSH_PORT:-22} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude-from=deploy/rsync-excludes.txt \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Ensure PHP 8.4 on server (shared with CRM)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' bash -se" <<'REMOTE'
          set -euo pipefail
          CRM_UPGRADE="/var/www/safehouse-crm/deploy/upgrade-php84.sh"
          echo "== PHP before =="
          php -v 2>/dev/null | head -1 || true
          if [[ -f "$CRM_UPGRADE" ]]; then
            sudo -n bash "$CRM_UPGRADE" || echo "WARNING: sudo upgrade failed — checking PHP..."
          fi
          PHP_MM="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;' 2>/dev/null || echo unknown)"
          if [[ "$PHP_MM" != "8.4" ]]; then
            echo "ERROR: server must run single PHP 8.4 (got ${PHP_MM}). Run: sudo bash ${CRM_UPGRADE}"
            exit 1
          fi
          echo "== PHP after =="
          php -v | head -1
          REMOTE

      - name: Post-deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          ssh -p "${DEPLOY_SSH_PORT:-22}" -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash ${DEPLOY_PATH}/deploy/post-deploy.sh"
